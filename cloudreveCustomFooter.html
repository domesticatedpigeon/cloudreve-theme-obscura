<script>
(() => {
	let on = false;
	try {
		on = !!localStorage.getItem("cr-perf");
	} catch (e) {}
	if (!on) return;
	let t0 = performance.now();
	const rows = new Map();
	const SRC = /cr\/(\d{4}-[\w-]+)\.js/g;
	const origin = () => {
		const lim = Error.stackTraceLimit;
		Error.stackTraceLimit = 8;
		const stack = new Error().stack || "";
		Error.stackTraceLimit = lim;
		for (const m of stack.matchAll(SRC)) if (m[1] !== "0005-perf") return m[1];
		return "(cloudreve)";
	};
	const timed = (kind, cb) => {
		if (typeof cb !== "function") return cb;
		const key = origin() + " · " + kind;
		return function (...args) {
			const s = performance.now();
			try {
				return cb.apply(this, args);
			} finally {
				const d = performance.now() - s;
				const r = rows.get(key) || { calls: 0, ms: 0, max: 0 };
				r.calls++;
				r.ms += d;
				if (d > r.max) r.max = d;
				rows.set(key, r);
			}
		};
	};
	const MO = window.MutationObserver;
	window.MutationObserver = class extends MO {
		constructor(cb) {
			super(timed("observer", cb));
		}
	};
	const RO = window.ResizeObserver;
	if (RO) {
		window.ResizeObserver = class extends RO {
			constructor(cb) {
				super(timed("resize", cb));
			}
		};
	}
	[["setInterval", "interval"], ["setTimeout", "timeout"], ["requestAnimationFrame", "frame"]].forEach(([name, kind]) => {
		const orig = window[name];
		window[name] = function (cb, ...args) {
			return orig.call(window, timed(kind, cb), ...args);
		};
	});
	window.crPerf = (reset) => {
		const secs = (performance.now() - t0) / 1000;
		const list = [...rows].map(([source, r]) => ({ source, calls: r.calls, "ms total": +r.ms.toFixed(1), "ms/s": +(r.ms / secs).toFixed(2), "max ms": +r.max.toFixed(1) })).sort((a, b) => b["ms total"] - a["ms total"]);
		console.table(list);
		const theme = list.filter((x) => !x.source.startsWith("(cloudreve)")).reduce((a, x) => a + x["ms total"], 0);
		console.log(`Theme: ${theme.toFixed(0)} ms in ${secs.toFixed(1)} s = ${(theme / secs).toFixed(1)} ms/s (${(theme / secs / 10).toFixed(2)}% of the main thread)`);
		if (reset) {
			rows.clear();
			t0 = performance.now();
		}
		return list;
	};
})();
//# sourceURL=cr/0005-perf.js
</script>
<script>
(() => {
	const cache = {};
	const subs = new Set();
	const lang = () => {
		const h = document.documentElement.getAttribute("lang") || "";
		if (h.includes("-")) return h;
		try {
			const l = localStorage.getItem("i18nextLng");
			if (l) return l;
		} catch (e) {}
		return "en-US";
	};
	const notify = () => subs.forEach((f) => {
		try {
			f();
		} catch (e) {}
	});
	const load = (l, ns) => {
		const id = l + "-" + ns;
		if (id in cache) return cache[id];
		cache[id] = null;
		try {
			const raw = localStorage.getItem("i18next_res_" + id);
			if (raw) return (cache[id] = JSON.parse(raw));
		} catch (e) {}
		fetch("/locales/" + l + "/" + ns + ".json")
			.then((r) => (r.ok ? r.json() : null))
			.then((j) => {
				if (!j) return;
				cache[id] = j;
				notify();
			})
			.catch(() => {});
		return null;
	};
	const T = (key, fallback) => {
		const c = key.indexOf(":");
		const ns = c > 0 ? key.slice(0, c) : "application";
		const path = c > 0 ? key.slice(c + 1) : key;
		const v = path.split(".").reduce((o, k) => (o && typeof o === "object" ? o[k] : undefined), load(lang(), ns));
		return typeof v === "string" && v ? v.replace(/\s*(\.\.\.|…)$/, "") : fallback;
	};
	const ATTR = { text: "crT", aria: "crTa", title: "crTt" };
	T.set = (el, key, fallback, what) => {
		const w = what || "text";
		el.dataset[ATTR[w]] = key + "|" + fallback;
		const v = T(key, fallback);
		if (w === "text") {
			if (el.textContent !== v) el.textContent = v;
		} else if (w === "aria") el.setAttribute("aria-label", v);
		else el.title = v;
		return el;
	};
	T.is = (text, key, fallback) => {
		const t = (text || "").trim().toLowerCase();
		return !!t && (t === T(key, fallback).trim().toLowerCase() || t === fallback.toLowerCase());
	};
	T.on = (fn) => subs.add(fn);
	const CSS = { "--cr-t-search": ["navbar.searchFiles", "Search"], "--cr-t-drop": ["fileManager.dropFileHere", "Drag and drop files here to upload"] };
	const apply = () => {
		Object.keys(ATTR).forEach((w) => document.querySelectorAll("[data-" + ATTR[w].replace(/[A-Z]/g, (m) => "-" + m.toLowerCase()) + "]").forEach((el) => {
			const raw = el.dataset[ATTR[w]];
			const bar = raw.indexOf("|");
			T.set(el, raw.slice(0, bar), raw.slice(bar + 1), w);
		}));
		const root = document.documentElement.style;
		for (const k in CSS) {
			const [key, fb] = CSS[k];
			const v = T(key, fb);
			if (root.getPropertyValue(k) !== JSON.stringify(v)) root.setProperty(k, JSON.stringify(v));
		}
	};
	T.on(apply);
	let lng = lang();
	new MutationObserver(() => {
		const l = lang();
		if (l === lng) return;
		lng = l;
		notify();
	}).observe(document.documentElement, { attributes: true, attributeFilter: ["lang"] });
	window.crT = T;
	apply();
})();
//# sourceURL=cr/0010-i18n.js

<script>
(() => {
	const keyOf = (el, prefix) => el && Object.keys(el).find((x) => x.startsWith(prefix));
	const fiberOf = (el) => {
		const k = keyOf(el, "__reactFiber$");
		return k ? el[k] : null;
	};
	const propsOf = (el) => {
		const k = keyOf(el, "__reactProps$");
		return k ? el[k] : null;
	};
	const rootFiber = () => {
		const root = document.getElementById("root");
		const k = keyOf(root, "__reactContainer$");
		return k ? (root[k].stateNode && root[k].stateNode.current) || root[k] : null;
	};
	const upFiber = (el, test, max = Infinity) => {
		let f = fiberOf(el);
		for (let i = 0; f && i < max; i++, f = f.return) {
			const p = f.memoizedProps;
			if (p && typeof p === "object" && test(p)) return f;
		}
		return null;
	};
	const up = (el, test, max) => {
		const f = upFiber(el, test, max);
		return f ? f.memoizedProps : null;
	};
	const fileOf = (el, max) => {
		const p = up(el, (x) => x.file, max);
		return p ? p.file : null;
	};
	const slider = (el) => upFiber(el, (p) => Array.isArray(p.images) && typeof p.index === "number", 40);
	let store = null;
	const getStore = () => {
		if (store) return store;
		for (let f = rootFiber(); f; f = f.child) {
			const p = f.memoizedProps;
			if (p && p.store && typeof p.store.getState === "function" && typeof p.store.dispatch === "function") return (store = p.store);
		}
		return null;
	};
	let router = null;
	const getRouter = () => {
		if (router) return router;
		const start = rootFiber();
		const queue = start ? [start] : [];
		for (let n = 0; queue.length && n < 5000; n++) {
			const f = queue.shift();
			const p = f.memoizedProps;
			if (p && p.router && typeof p.router.navigate === "function") return (router = p.router);
			if (f.child) queue.push(f.child);
			if (f.sibling) queue.push(f.sibling);
		}
		return null;
	};
	window.cr = { fiberOf, propsOf, rootFiber, up, upFiber, fileOf, slider, store: getStore, router: getRouter };
})();
//# sourceURL=cr/0015-core.js
</script>
<script>
(() => {
	const MARGIN = 600000;
	let fresh = null;
	let pending = null;
	const login = () => {
		try {
			const o = JSON.parse(localStorage.getItem("cloudreve_session") || "null");
			const s = o && o.current && o.sessions && o.sessions[o.current];
			return s && !s.signedOut && s.token && s.token.access_token ? { uid: o.current, token: s.token } : null;
		} catch (e) {
			return null;
		}
	};
	const left = (iso) => Date.parse(iso) - Date.now();
	const token = () => {
		const s = login();
		if (!s) return Promise.resolve("");
		const best = fresh && fresh.uid === s.uid && left(fresh.token.access_expires) > left(s.token.access_expires) ? fresh.token : s.token;
		if (left(best.access_expires) > MARGIN) return Promise.resolve(best.access_token);
		if (left(s.token.refresh_expires) <= MARGIN) return Promise.resolve("");
		if (!pending) {
			pending = fetch("/api/v4/session/token/refresh", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: s.token.refresh_token }) })
				.then((r) => r.json())
				.then((j) => {
					if (!j || j.code !== 0 || !j.data || !j.data.access_token) throw new Error("token refresh failed: " + (j && j.code) + " " + (j && j.msg));
					fresh = { uid: s.uid, token: j.data };
					return j.data.access_token;
				})
				.finally(() => (pending = null));
		}
		return pending;
	};
	window.crApi = (path, params) => token().then((t) => fetch("/api/v4/" + path + "?" + new URLSearchParams(params).toString(), { headers: t ? { Authorization: "Bearer " + t } : {} })).then((r) => r.json());
})();
//# sourceURL=cr/0020-api.js
</script>
<script>
(() => {
	const DEFAULTS = { tree_view_auto_expand: false };
	const fill = (o) => {
		if (!o || typeof o !== "object" || !o.sessions || !o.anonymousSettings) return false;
		let changed = false;
		[o.anonymousSettings, ...Object.values(o.sessions).map((s) => s && s.settings)].forEach((st) => {
			if (!st || typeof st !== "object") return;
			for (const k in DEFAULTS) {
				if (k in st) continue;
				st[k] = DEFAULTS[k];
				changed = true;
			}
		});
		return changed;
	};
	const stringify = JSON.stringify;
	JSON.stringify = function (v, ...rest) {
		fill(v);
		return stringify.call(this, v, ...rest);
	};
	try {
		const o = JSON.parse(localStorage.getItem("cloudreve_session") || "null");
		if (fill(o)) localStorage.setItem("cloudreve_session", stringify(o));
	} catch (e) {}
})();
//# sourceURL=cr/0030-user-setting-defaults.js
</script>
<script>
(() => {
	if (!matchMedia("(pointer: coarse)").matches) return;
	const warmed = new WeakSet();
	let timer = 0;
	const schedule = () => {
		if (!timer) timer = setTimeout(warm, 300);
	};
	const warm = () => {
		timer = 0;
		if (document.documentElement.classList.contains("cr-scrolling") || document.querySelector(".PhotoView-Portal")) {
			schedule();
			return;
		}
		const t0 = performance.now();
		for (const el of document.querySelectorAll(".MuiGrid-container [data-rect-id].MuiButtonBase-root")) {
			if (warmed.has(el)) continue;
			warmed.add(el);
			el.dispatchEvent(new FocusEvent("focusout", { bubbles: true }));
			if (performance.now() - t0 > 8) {
				schedule();
				return;
			}
		}
	};
	new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
	schedule();
})();

(() => {
	const html = document.documentElement;
	html.classList.add("cr-boot");
	const mq = matchMedia("(max-width: 599.95px)");
	const t0 = performance.now();
	let hold = 0;
	let seen = 0;
	const ready = () => {
		const root = document.getElementById("root");
		if (!root || !root.firstElementChild) return false;
		const header = [...document.querySelectorAll("header.MuiAppBar-root")].find((h) => !h.closest(".MuiDialog-root, .MuiPopover-root"));
		if (!seen) seen = performance.now();
		if (!header) return !!root.querySelector("main, .MuiContainer-root, .MuiPaper-root");
		if (performance.now() - seen > 900) return true;
		if (mq.matches) return !!header.querySelector(".cr-tbp-mc");
		return html.classList.contains("cr-dock") || !!header.querySelector(".cr-tbp-av");
	};
	const reveal = () => {
		html.classList.add("cr-booted");
		requestAnimationFrame(() => {
			html.classList.remove("cr-boot");
			setTimeout(() => html.classList.remove("cr-booted"), 400);
		});
	};
	const tick = () => {
		if (performance.now() - t0 > 2500) return reveal();
		if (ready()) hold++;
		else hold = 0;
		if (hold >= 3) return reveal();
		requestAnimationFrame(tick);
	};
	requestAnimationFrame(tick);
})();

<script>
(() => {
	const KEY = "cr-preload-reload";
	setTimeout(() => {
		try {
			sessionStorage.removeItem(KEY);
		} catch (e) {}
	}, 15000);
	const restyle = (href, n) => {
		const l = document.createElement("link");
		l.rel = "stylesheet";
		l.href = n ? href + (href.includes("?") ? "&" : "?") + "r=" + n : href;
		l.onerror = () => {
			l.remove();
			if (n < 3) setTimeout(() => restyle(href, n + 1), 1000 * (n + 1));
		};
		document.head.appendChild(l);
	};
	window.addEventListener("vite:preloadError", (e) => {
		const msg = String((e.payload && e.payload.message) || "");
		const css = /preload CSS for (\S+)/.exec(msg);
		if (css) {
			e.preventDefault();
			console.warn("Stylesheet failed to load, retrying:", css[1]);
			setTimeout(() => restyle(css[1], 1), 500);
			return;
		}
		try {
			if (sessionStorage.getItem(KEY)) return;
			sessionStorage.setItem(KEY, "1");
		} catch (err) {
			return;
		}
		e.preventDefault();
		location.reload();
	});
})();

<script>
(() => {
	const FACTOR = 1;
	const PILL = 999;
	const px = (v) => v.replace(/(\d*\.?\d+)px/g, (m, n) => {
		const value = parseFloat(n);
		return (value >= 999 ? PILL : Math.round(value * FACTOR * 2) / 2) + "px";
	});
	const scaleText = (text) => text.replace(/(border(?:-(?:top|bottom)-(?:left|right))?-radius\s*:\s*)([^;}]+)/gi, (m, prop, value) => prop + px(value));
	const done = new WeakSet();
	const scaleRules = (rules) => {
		for (const rule of rules) {
			if (done.has(rule)) continue;
			done.add(rule);
			if (rule.selectorText && /\.cr-(v|legend|wrap-toast|tip|tbp)|cr-selbar/.test(rule.selectorText)) continue;
			if (rule.style) {
				for (let i = 0; i < rule.style.length; i++) {
					const name = rule.style[i];
					if (name.includes("radius")) {
						rule.style.setProperty(name, px(rule.style.getPropertyValue(name)), rule.style.getPropertyPriority(name));
					}
				}
			}
			if (rule.cssRules) scaleRules(rule.cssRules);
		}
	};
	const scaleSheet = (sheet) => {
		try {
			scaleRules(sheet.cssRules);
		} catch (e) {}
	};
	const insertRule = CSSStyleSheet.prototype.insertRule;
	CSSStyleSheet.prototype.insertRule = function (rule, index) {
		const i = insertRule.call(this, typeof rule === "string" ? scaleText(rule) : rule, index);
		try {
			done.add(this.cssRules[i]);
		} catch (e) {}
		return i;
	};
	const scaleAll = () => {
		for (const sheet of document.styleSheets) scaleSheet(sheet);
	};
	scaleAll();
	new MutationObserver(scaleAll).observe(document.head, { childList: true, subtree: true, characterData: true });
	document.addEventListener("DOMContentLoaded", scaleAll);
})();

	let cur = null;
	document.addEventListener("mouseover", (e) => {
		const t = e.target instanceof Element ? e.target : null;

		}
	};
	let tries = 0;
	const hook = () => {
		const s = cr.store();
		if (!s) {
			if (tries++ < 50) setTimeout(hook, 200);
			return;
		}
		let open = false;
		s.subscribe(() => {
			const g = s.getState().globalState;
			const o = !!(g && g.shareLinkDialogOpen);
			if (o && !open && !g.shareLinkDialogShare) patch();
			open = o;
		});
	};
	hook();
})();

<script>
(() => {
	const MAX = 30;
	const SHOW = 12;
	const MY = /^cloudreve:\/\/my\//;
	const SHARE = /^cloudreve:\/\/([^/:@]+)(?::[^/@]*)?@share(\/|$)/;
	const session = () => {
		try {
			const o = JSON.parse(localStorage.getItem("cloudreve_session") || "null");
			if (!o) return null;
			const ss = o.sessions || {};
			return ss[o.current] || Object.values(ss)[0] || null;
		} catch (e) {
			return null;
		}
	};
	const keyOf = (path) => {
		const s = SHARE.exec(path);
		if (!s && !MY.test(path)) return "";
		const cur = session();
		if (cur && cur.user && cur.user.id) return "cr-recent:" + cur.user.id;
		return s ? "cr-recent:s:" + s[1] : "";
	};
	const mem = new Map();
	const read = (key) => {
		if (mem.has(key)) return mem.get(key);
		let v = [];
		try {
			v = JSON.parse(localStorage.getItem(key) || "[]");
		} catch (e) {}
		if (!Array.isArray(v)) v = [];
		mem.set(key, v);
		return v;
	};
	const write = (key, list) => {
		mem.set(key, list.slice(0, MAX));
		try {
			localStorage.setItem(key, JSON.stringify(mem.get(key)));
		} catch (e) {}
	};
	const record = (file) => {
		const key = keyOf(file.path);
		if (!key) return;
		const list = read(key).filter((x) => x.path !== file.path);
		const link = (file.metadata && file.metadata["sys:shared_redirect"]) || "";
		const entry = { path: file.path, name: file.name, at: Date.now() };
		if (link) entry.link = link;
		list.unshift(entry);
		write(key, list);
		sync();
	};
	const forget = (path) => {
		const key = keyOf(path);
		if (key) write(key, read(key).filter((x) => x.path !== path));
		sync();
	};
	const fm = () => {
		const s = cr.store();
		const f = s && s.getState().fileManager;
		return (f && f[0]) || null;
	};
	const curPath = () => {
		const f = fm();
		if (f && f.path) return f.path;
		try {
			return new URLSearchParams(location.search).get("path") || "";
		} catch (e) {
			return "";
		}
	};
	const navPath = () => {
		let q = "";
		try {
			q = new URLSearchParams(location.search).get("path") || "";
		} catch (e) {}
		if (q || location.pathname.startsWith("/home")) return q;
		const f = fm();
		return (f && f.path) || "";
	};
	const rootKey = () => {
		const p = navPath();
		if (location.pathname.startsWith("/home") && (!p || /^cloudreve:\/\/my\/?$/.test(p))) return keyOf("cloudreve://my/");
		if (/^cloudreve:\/\/[^/]+@share\/?$/.test(p)) return keyOf(p);
		return "";
	};
	const parentOf = (path) => path.slice(0, path.lastIndexOf("/"));
	const norm = (p) => (p || "").replace(/^(cloudreve:\/\/[^/:@]+):[^/@]*@/, "$1@").replace(/\/$/, "");
	const same = (a, b) => norm(a) === norm(b);
	const tileOf = (path) => {
		for (const el of document.querySelectorAll("main [data-rect-id], main .MuiImageListItem-root")) {
			const f = cr.fileOf(el, 30);
			if (f && same(f.path, path)) return el;
		}
		return null;
	};
	let opening = 0;
	const open = (path) => {
		const id = ++opening;
		const parent = parentOf(path);
		if (!same(curPath(), parent)) {
			const r = cr.router();
			if (!r) return;
			r.navigate("/home?" + new URLSearchParams({ path: parent }).toString());
		}
		const t0 = Date.now();
		const tick = () => {
			if (id !== opening) return;
			const el = tileOf(path);
			if (el) {
				el.scrollIntoView({ block: "nearest" });
				el.dispatchEvent(new MouseEvent("dblclick", { bubbles: true, cancelable: true, detail: 2 }));
				return;
			}
			const f = fm();
			const list = f && f.list && f.list.parent && same(f.list.parent.path, parent) ? f.list : null;
			if (list && Array.isArray(list.files) && !(list.pagination && list.pagination.next_token) && !list.files.some((x) => same(x.path, path))) return forget(path);
			if (Date.now() - t0 < 6000) setTimeout(tick, 100);
		};
		setTimeout(tick, 0);
	};
	const known = (path) => {
		const f = fm();
		const tree = f && f.tree;
		if (!tree) return "";
		for (const k in tree) {
			const th = tree[k] && tree[k].thumb;
			if (th && th.src && same(k, path) && (!th.expires || Date.parse(th.expires) > Date.now())) return th.src;
		}
		return "";
	};
	const cacheThumb = (path, d) => {
		const s = cr.store();
		if (s) s.dispatch({ type: "fileManagerSlice/setThumbCache", payload: { index: 0, value: [path, d] } });
	};
	const loading = new Map();
	const fetchThumb = (x) => {
		let p = loading.get(x.path);
		if (!p) {
			p = crApi("file/thumb", { uri: x.link || x.path })
				.then((j) => {
					if (!j || j.code !== 0 || !j.data || !j.data.url) throw new Error((j && j.code) + " " + (j && j.msg));
					cacheThumb(x.path, j.data);
					return j.data.url;
				})
				.finally(() => loading.delete(x.path));
			loading.set(x.path, p);
		}
		return p;
	};
	let dbP = null;
	const db = () => dbP || (dbP = new Promise((res, rej) => {
		const r = indexedDB.open("cr-thumbs", 1);
		r.onupgradeneeded = () => r.result.createObjectStore("t");
		r.onsuccess = () => res(r.result);
		r.onerror = () => rej(r.error);
	}).catch((err) => {
		console.warn("Recent files: thumbnail cache unavailable", err && err.message);
		return null;
	}));
	const idb = (mode, fn) => db().then((d) => d && new Promise((res, rej) => {
		const tx = d.transaction("t", mode);
		const q = fn(tx.objectStore("t"));
		tx.oncomplete = () => res(q && q.result);
		tx.onerror = tx.onabort = () => rej(tx.error);
	})).catch(() => undefined);
	const blobs = new Map();
	const kept = new Set();
	const ckOf = (key, path) => key + "|" + norm(path);
	const blobUrl = (ck, blob) => {
		const old = blobs.get(ck);
		blobs.set(ck, URL.createObjectURL(blob));
		if (old) URL.revokeObjectURL(old);
		return blobs.get(ck);
	};
	const stored = (ck) => blobs.has(ck) ? Promise.resolve(blobs.get(ck)) : idb("readonly", (s) => s.get(ck)).then((v) => v && v.blob instanceof Blob ? blobs.get(ck) || blobUrl(ck, v.blob) : "");
	const unstore = (ck) => {
		const u = blobs.get(ck);
		if (u) URL.revokeObjectURL(u);
		blobs.delete(ck);
		kept.delete(ck);
		return idb("readwrite", (s) => s.delete(ck));
	};
	const keep = (ck, url) => {
		if (kept.has(ck)) return;
		kept.add(ck);
		fetch(url)
			.then((r) => (r.ok ? r.blob() : null))
			.then((b) => b && b.type.startsWith("image/") && idb("readwrite", (s) => s.put({ blob: b, at: Date.now() }, ck)).then(() => blobUrl(ck, b)))
			.catch(() => kept.delete(ck));
	};
	const prune = (key, items) => {
		const want = new Set(items.map((x) => ckOf(key, x.path)));
		idb("readonly", (s) => s.getAllKeys()).then((ks) => (ks || []).forEach((k) => typeof k === "string" && k.startsWith(key + "|") && !want.has(k) && unstore(k)));
	};
	const owned = (img) => !!row && row.contains(img);
	const thumb = (x, img, tries, fresh) => {
		const n = tries || 0;
		const ck = ckOf(img.crKey, x.path);
		const retry = () => {
			if (n < 5) setTimeout(() => owned(img) && !img.getAttribute("src") && thumb(x, img, n + 1, true), [1500, 5000, 15000, 45000, 120000][n]);
		};
		const show = (url) => {
			if (!owned(img) || img.getAttribute("src")) return;
			const cached = url.startsWith("blob:");
			img.onload = () => {
				img.classList.add("cr-on");
				if (!cached) keep(ck, url);
			};
			img.onerror = () => {
				img.onerror = null;
				img.removeAttribute("src");
				img.classList.remove("cr-on");
				if (cached) return unstore(ck).then(() => thumb(x, img, n, true));
				cacheThumb(x.path, { url: "", expires: new Date(0).toISOString() });
				retry();
			};
			img.src = url;
		};
		const url = known(x.path);
		if (url) return show(url);
		const remote = () => fetchThumb(x).then(show, (err) => {
			console.warn("Recent files: no thumbnail for", x.path, err.message);
			retry();
		});
		if (fresh) return remote();
		stored(ck).then((b) => (b ? show(b) : remote()));
	};
	const info = (path) => crApi("file/info", { uri: path })
		.then((j) => (j && j.code === 0 && j.data && j.data.path ? j.data : j && j.code === 404 ? null : undefined))
		.catch(() => undefined);
	const menuOpen = () => [...document.querySelectorAll(".MuiMenu-root")].some((m) => getComputedStyle(m).visibility !== "hidden" && m.getAttribute("aria-hidden") !== "true");
	let menuT = 0;
	const menu = (card, path, x, y) => {
		const s = cr.store();
		if (!s) return;
		document.querySelectorAll(".cr-recent-i.cr-menu-open").forEach((c) => c.classList.remove("cr-menu-open"));
		card.classList.add("cr-menu-open");
		info(path).then((file) => {
			if (file === null) {
				card.classList.remove("cr-menu-open");
				return forget(path);
			}
			if (!file || !card.isConnected) return card.classList.remove("cr-menu-open");
			s.dispatch({ type: "fileManagerSlice/setSelected", payload: { index: 0, value: [file] } });
			s.dispatch({ type: "fileManagerSlice/setContextMenu", payload: { index: 0, value: { open: true, pos: { x, y }, type: "file", fmIndex: 0, targets: { [file.path]: file } } } });
			clearInterval(menuT);
			let seen = false;
			const t0 = Date.now();
			menuT = setInterval(() => {
				if (menuOpen()) seen = true;
				if (seen && !menuOpen()) card.classList.remove("cr-menu-open");
				if ((!seen && Date.now() - t0 < 1500) || menuOpen() || document.querySelector(".MuiDialog-root")) return;
				clearInterval(menuT);
				card.classList.remove("cr-menu-open");
				const f = fm();
				const sel = Object.keys((f && f.selected) || {});
				const listed = f && f.list && Array.isArray(f.list.files) && f.list.files.some((z) => z.path === file.path);
				if (sel.length === 1 && sel[0] === file.path && !listed) s.dispatch({ type: "fileManagerSlice/setSelected", payload: { index: 0, value: [] } });
			}, 150);

<script>
(() => {
	const RESIZE = /cursor:\s*(col-resize|ew-resize|e-resize|w-resize)/;
	const ONLY = /^\.css-[\w-]+(?::{1,2}[\w-]+(?:\([^)]*\))?)*$/;
	const found = new Set();
	let style = null;
	let seen = 0;
	const scan = () => {
		let n = 0;
		for (const sh of document.styleSheets) {
			let rules;
			try {
				rules = sh.cssRules;
			} catch (e) {
				continue;
			}
			n += rules.length;
			for (const r of rules) {
				if (!r.selectorText || !RESIZE.test(r.cssText)) continue;
				r.selectorText.split(",").forEach((sel) => {
					sel = sel.trim();
					if (ONLY.test(sel)) found.add(sel.replace(/:.*$/, ""));
				});
			}
		}
		if (n === seen) return;
		seen = n;
		if (!found.size) return;
		if (!style) {
			style = document.createElement("style");
			document.head.appendChild(style);
		}
		const sel = [...found].map((s) => "#root " + s).join(", ");
		const css = sel + " { pointer-events: none !important; cursor: inherit !important; opacity: 0 !important; }";
		if (style.textContent !== css) style.textContent = css;
	};
	const width = () => {
		const s = cr.store();
		const g = s && s.getState().globalState;
		if (g && typeof g.drawerWidth === "number" && g.drawerWidth !== 240) s.dispatch({ type: "globalState/setDrawerWidth", payload: 240 });
	};

		width();
	};
	tick();

	const OVERLAY = ".MuiPopover-root, .MuiMenu-root, .MuiModal-root, .MuiDialog-root";

	document.addEventListener("scroll", (e) => {
		const el = e.target === document ? document : e.target;
		if (Date.now() < until && !moved && last.has(el)) {
			const want = last.get(el);
			if (top(el) !== want) {

<script>
(() => {
	const ROW = '.cr-explorer [data-testid="virtuoso-item-list"] > [data-index] > .MuiBox-root';
	const SQ_ON = "M9 3h6a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V9a6 6 0 0 1 6-6Zm7.28 6.73a.75.75 0 0 0-1.06-1.06l-4.47 4.47-1.97-1.97a.75.75 0 0 0-1.06 1.06l2.5 2.5a.75.75 0 0 0 1.06 0l5-5Z";
	const SQ_OFF = "M9 3h6a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V9a6 6 0 0 1 6-6ZM9 4a5 5 0 0 0-5 5v6a5 5 0 0 0 5 5h6a5 5 0 0 0 5-5V9a5 5 0 0 0-5-5H9Z";
	const SQ = "M9 3h6a6 6 0 0 1 6 6v6a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V9a6 6 0 0 1 6-6Z";
	const isCheck = (svg) => {
		const d = svg && svg.querySelector("path") && svg.querySelector("path").getAttribute("d");
		return !!d && (d.startsWith(SQ) || d.startsWith("M12 2c5.523"));
	};
	const folders = new Map();
	const typeIcon = (host, file) => {
		if (file.type === 0) return window.crFicon ? window.crFicon(file.name || "") : null;
		const src = [...host.querySelectorAll("svg")].find((x) => !isCheck(x));
		if (src) {
			const c = src.cloneNode(true);
			c.dataset.crPin = "1";
			folders.set(file.path, c);
		}
		return folders.has(file.path) ? folders.get(file.path).cloneNode(true) : null;
	};
	const lineOf = (row) => row.firstElementChild && row.firstElementChild.querySelector(":scope > p > .MuiBox-root");
	const hostOf = (line) => line && line.querySelector(":scope > div");
	const clickIcon = (row) => {
		const host = hostOf(lineOf(row));
		if (!host) return;
		const target = [host, ...host.querySelectorAll("*")].find((x) => cr.propsOf(x) && typeof cr.propsOf(x).onClick === "function");
		(target || host).dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true }));
	};
	const stop = (e) => e.stopPropagation();
	const decorate = (row, sel) => {
		const file = cr.fileOf(row, 30);
		if (!file) return;
		const line = lineOf(row);
		const host = hostOf(line);
		if (!host) return;
		const thumb = !!host.querySelector(":scope > .MuiBox-root");
		let cb = line.querySelector(":scope > .cr-lcb");
		if (!cb) {
			cb = document.createElement("span");
			cb.className = "cr-lcb";
			cb.setAttribute("role", "checkbox");
			cb.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="' + SQ_OFF + '"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="' + SQ_ON + '"/></svg>';
			["mousedown", "dblclick", "pointerdown", "touchstart"].forEach((t) => cb.addEventListener(t, stop, { passive: true }));
			cb.addEventListener("click", (e) => {
				e.stopPropagation();
				e.preventDefault();
				clickIcon(row);
			});
			line.insertBefore(cb, line.firstChild);
		}
		const on = !!sel[file.path];
		if (cb.classList.contains("cr-on") !== on) cb.classList.toggle("cr-on", on);
		if (cb.getAttribute("aria-checked") !== String(on)) cb.setAttribute("aria-checked", String(on));
		const key = file.path + "|" + thumb;
		let ti = row.querySelector(".cr-lti");
		if (!ti || ti.dataset.k !== key) {
			if (ti) ti.remove();
			const svg = typeIcon(host, file);
			if (svg) {
				ti = document.createElement("span");
				ti.className = thumb ? "cr-lti" : "cr-lti cr-lti-p";
				ti.dataset.k = key;
				ti.appendChild(svg);
				if (thumb) {
					const name = line.querySelector("[aria-label]");
					const nameBox = name && name.parentElement;
					if (nameBox && nameBox.parentElement) nameBox.parentElement.insertBefore(ti, nameBox);
				} else line.insertBefore(ti, host);
			}
		}
		if (!row.querySelector(":scope > .cr-lmore")) {
			const more = document.createElement("span");
			more.className = "cr-grid-more cr-lmore";
			more.setAttribute("role", "button");
			if (window.crT) crT.set(more, "fileManager.moreActions", "More actions", "aria");
			["mousedown", "dblclick", "pointerdown", "touchstart"].forEach((t) => more.addEventListener(t, stop, { passive: true }));
			more.addEventListener("click", (e) => {
				e.stopPropagation();
				e.preventDefault();
				const r = more.getBoundingClientRect();
				row.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: r.left, clientY: r.bottom, button: 2, buttons: 2 }));
			});
			row.appendChild(more);
		}
	};
	const run = () => {
		const rows = document.querySelectorAll(ROW);
		if (!rows.length) return;
		const s = cr.store();
		const fm = s && s.getState().fileManager;
		const sel = (fm && fm[0] && fm[0].selected) || {};
		rows.forEach((r) => decorate(r, sel));
	};
	let q = false;
	const schedule = () => {
		if (q) return;
		q = true;
		requestAnimationFrame(() => {
			q = false;
			run();
		});
	};
	new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
	const t = setInterval(() => {
		const s = cr.store();
		if (!s) return;
		clearInterval(t);
		let last = null;
		s.subscribe(() => {
			const fm = s.getState().fileManager;
			const sel = fm && fm[0] && fm[0].selected;
			if (sel === last) return;
			last = sel;
			schedule();
		});
	}, 500);
	run();
})();
//# sourceURL=cr/0820-list-checkboxes.js
</script>

<script>
(() => {
	const html = document.documentElement;
	let path = "";
	let start = 0;
	let t = 0;
	const ready = () => {
		const c = document.querySelector("main div.cr-h29 > .MuiContainer-root");
		if (!c) return false;
		if (c.querySelector(".MuiSkeleton-root")) return false;
		const h = c.querySelector("h1, h2, h3, h4, h5");
		if (h && /^[\s\-–—]*$/.test(h.textContent)) return false;
		const img = c.querySelector(".MuiAvatar-root img");
		return !img || img.complete;
	};
	const check = () => {
		const on = location.pathname.startsWith("/profile");
		if (!on) {
			path = "";
			if (html.classList.contains("cr-pf-wait")) html.classList.remove("cr-pf-wait");
			return;
		}
		if (location.pathname !== path) {
			path = location.pathname;
			start = performance.now();
		}
		const wait = performance.now() - start < 1500 && !ready();
		if (html.classList.contains("cr-pf-wait") !== wait) html.classList.toggle("cr-pf-wait", wait);
		clearTimeout(t);
		if (wait) t = setTimeout(check, 100);
	};
	new MutationObserver(check).observe(document.body, { childList: true, subtree: true });
	document.addEventListener("load", (e) => {
		if (e.target instanceof HTMLImageElement) check();
	}, true);
	document.addEventListener("error", (e) => {
		if (e.target instanceof HTMLImageElement) check();
	}, true);
	check();
})();
//# sourceURL=cr/0870-profile-loading.js
</script>

(() => {

		if (!t || !t.closest(".cr-path") || t.closest("button, .MuiButtonBase-root, input")) return;
		e.stopPropagation();
	}, true);
	["mouseover", "pointerover", "focusin", "touchstart"].forEach((type) => window.addEventListener(type, (e) => {
		if (document.documentElement.classList.contains("cr-dock")) return;
		const t = e.target instanceof Element ? e.target : null;
		if (t && t.closest(".cr-path")) e.stopPropagation();
	}, { capture: true, passive: true }));
})();

(() => {

			const title = d.querySelector(".MuiDialog-paper > .MuiBox-root:first-child > .MuiDialogTitle-root + .MuiDivider-root") && d.querySelector(".MuiDialogTitle-root");

		});
	};

	mark();
})();
